<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="style.css">

<body>
    <div class="container flex bg-black">
        <!-- SECTION left -->
        <div class="left">
            <div class="close">
                <img class="invert" src="close.svg" alt="">
            </div>
            <div class="home bg-gray rounded m-1 p-1">
                <div class="logo"><img class="invert" src="logo.svg" alt="logo"></div>
                <ul>
                    <li><img class="invert" src="home.svg" alt="home">Home</li>
                    <li><img class="invert" src="search.svg" alt="search">Search</li>
                </ul>
            </div>
            <div class="library bg-gray rounded p-1">
                <div class="heading">
                    <img class="invert" src="playlist.svg" alt="">
                    <h2 id="libraryTitle">Your Library</h2>
                </div>

                <div class="songList">
                    <ul>
                    </ul>
                </div>

                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>

        </div>


        <!-- SECTION RIGHT -->
        <div class="right bg-gray rounded">

                <div class="nav">
                    <div class="flex">
                        <img class="invert hamburger" src="hamburger.svg" alt="">

                                stroke="#b3b3b3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>

                <div class="buttons">
                    <button class="signupbtn">Sign up</button>
                    <button class="loginbtn">Log in</button>

                <div class="playbar">

                    <div class="abovebar">

                        <div class="songinfo"></div>
                        <div class="songbuttons">
                            <img id="previous" src="previous.svg" alt="">
                            <img id="play" src="play.svg" alt="">
                            <img id="next" src="nextsong.svg" alt="">
                        </div>
                        <div class="volume">
                            <img class="invert" id="volumeIcon" src="volume.svg" width="22">
                            <input type="range" id="volume" min="0" max="100" value="100">
                        </div>
                    </div>
                    <div class="seekContainer">
                        <span class="currentTime">00:00</span>

                        <div class="seekbar">
                            <div class="progress"></div>
                            <div class="circle"></div>
                        </div>
                        <span class="totalTime">00:00</span>
                    </div>
